pipeline:
  name: Payments Release Pipeline
  identifier: payments_release_pipeline
  projectIdentifier: __PROJECT_IDENTIFIER__
  orgIdentifier: __ORG_IDENTIFIER__
  tags:
    team: payments
    workshop: template-sprawl
  stages:
    - stage:
        name: Change Gate
        identifier: change_gate
        description: Workshop demo — payments team approval path
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  name: Payments Manual Approval
                  identifier: payments_manual_approval
                  template:
                    templateRef: payments_manual_approval
                    versionLabel: "1"
                    templateInputs:
                      type: HarnessApproval
                      spec:
                        approvers:
                          userGroups: <+input>
