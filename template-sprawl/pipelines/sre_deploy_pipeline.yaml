        name: Change Gate
        identifier: change_gate
        description: Workshop demo — SRE approval path (near-duplicate of payments)
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  name: SRE Deploy Approval v2
                  identifier: sre_deploy_approval_v2
